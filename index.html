<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    
</head>
<style>
*{
    margin: 10px;
    padding: 0;
     box-sizing: border-box;
}
header{
    background:linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.2)), url("images.jpg");
    width: 100%;
    height: 100vh;
    background-size: cover;
    background-position: center;
   font-family: 'Times New Roman', Times, serif;
}
nav{
    color: white;
    display: flex;
    justify-content:space-around;
    width: 100%;
    height: 100vh;
    align-items: top;
    padding: 20px;
}
.logo{
    font-size: 40px;
    letter-spacing: 2px;
    align-items: flex-start;
}
.menu ul{
    padding: 10px 20px;
    font-size: 18px;
    display: flex;
}
.menu ul li{
    display: inline-block;
    position: relative;
}
.menu a{
    text-decoration: none;
    color: white;
}
.menu a::before{
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width:0%;
    height: 100%;
    border-bottom: 2px solid rgb(180, 64, 64);
    transition: 0.4s linear;
}
.menu a:hover::before{
    width: 100%;
}
.register a{
 text-decoration: none;
    color: white;
    padding: 10px 20px;
    font-size: 20px;
    background: rgb(185, 68, 68);
    border-radius: 10px;
    transition: 0.4s;
}
.register a:hover{
    background: transparent;
    border: 2px solid rgb(194, 58, 58);
}

.H-txt{
    max-width: 650px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
    text-align: center;
}

.H-txt span{
    letter-spacing: 5px;
}
.H-txt h1{
    font-size: 4em;
}
.H-txt a{
    text-decoration: none;
    background-color: rgb(197, 57, 57);
    color: white;
    letter-spacing: 5px;
    padding: 10px;
    transition: 0.4s;
}
.H-txt a:hover{
    background: transparent;
    border: 2px solid rgb(194, 58, 58);
}
.f_txt{
    color: rgb(26, 24, 24);
    width: 100%;
    height: 100%;
    text-align: center;
    padding: 0;
    margin: 0;
    font-size: 1.5em;
    display: flex;
    justify-content: space-around;
}
.f_txt span{
    letter-spacing: 5px;
    color: black;
    margin: 5px;
    padding: 5px;
    
}

</style>
    

<body>
    <header>
        <nav>
        <div class="logo">
            Travel-X
        </div>
        <div class="menu">
                <ul>
                    <li><a href="#Home">Home</a></li>
                    <li><a href="#About us">About Us</a></li>
                    <li><a href="#Hill Stations">Hill Stations</a></li>
                    <li><a href="#Our Sites">Our Sites</a></li>
                    <li><a href="#Contact">Contact</a></li>
                </ul>
        </div>
        <div class="register">
        <a href="#">Register</a>
    </div>
    </nav>

    <section class="H-txt">
        <span>Enjoy</span>
        <h1>International Travel Agency</h1>
        <br>
        <a href="#">Book Your Trip</a>
    </section>
    </header> 
    <span>EXPLORE NOW</span>
        <br>
        </section> 
    <footer>
        <nav>
            <div class="f_txt">
                <div>
                <h1>2K+</h1>
                <p>Years of experience</p>
                </div>
                <div>
                <h1>10K+</h1>
                <p>Happy Customers</p>
                </div>
                <div>
                <h1>4.8</h1>
                <p>Overall Rating</p>
                <br>
                </div>
            </div>
            </nav>
            <section class="f_txt">
                <div>
        
    </footer>  
</body>
</html>
